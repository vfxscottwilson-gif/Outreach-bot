name: generate-emails
on:
  workflow_dispatch:
    inputs:
      limit:
        description: "How many new leads to write this run (20-30 is a good number)"
        required: false
        default: "25"
  # To also run by itself every day, delete the # at the start of the next 2 lines:
  # schedule:
  #   - cron: "0 4 * * *"
permissions:
  contents: read
concurrency:
  group: generate
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -u generate.py
        env:
          # Google Sheet
          SHEET_ID: ${{ secrets.SHEET_ID }}
          GOOGLE_SA: ${{ secrets.GOOGLE_SA }}
          # Keys: BOTH spellings are passed on, whichever you created in GitHub. A missing one is just empty.
          GEMINI_KEY: ${{ secrets.GEMINI_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GROQ_KEY: ${{ secrets.GROQ_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_KEY: ${{ secrets.OPENROUTER_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          YOUTUBE_KEY: ${{ secrets.YOUTUBE_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          ZEROBOUNCE_KEY: ${{ secrets.ZEROBOUNCE_KEY }}
          ZEROBOUNCE_API_KEY: ${{ secrets.ZEROBOUNCE_API_KEY }}
          # NO model variables on purpose: the script asks each provider which models your key can use.
          PYTHONUNBUFFERED: "1"
          # Tabs and limits
          MASTER_TAB: ${{ vars.MASTER_TAB }}
          OUTPUT_TAB: ${{ vars.OUTPUT_TAB }}
          LOG_TAB: ${{ vars.LOG_TAB }}
          RUN_LIMIT: ${{ inputs.limit || vars.RUN_LIMIT }}
          MAX_RUN_MIN: ${{ vars.MAX_RUN_MIN }}
          WRITE_PAUSE: ${{ vars.WRITE_PAUSE }}
          # Switches
          INCLUDE_OPTOUT: ${{ vars.INCLUDE_OPTOUT }}
          ALLOW_RISKY: ${{ vars.ALLOW_RISKY }}
          ALLOW_ROLE: ${{ vars.ALLOW_ROLE }}
          VERIFY_MX: ${{ vars.VERIFY_MX }}
          DRY_RUN: ${{ vars.DRY_RUN }}
